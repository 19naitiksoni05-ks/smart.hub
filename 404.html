<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — Smart Hub</title>
  <meta name="description" content="The requested page or resource could not be found on Smart Hub.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div id="page-header"></div>

<main style="min-height:75vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;position:relative;">
  <div class="auth-bg-grid"></div>
  <div style="max-width:540px;width:100%;text-align:center;position:relative;z-index:2;background:var(--bg-card);border:1.5px solid var(--border-outline);border-radius:var(--radius-sm);padding:48px 32px;box-shadow:0 24px 60px rgba(0,0,0,0.45);">
    <div style="font-family:var(--font-tech);font-size:clamp(3.5rem, 8vw, 6rem);font-weight:900;color:var(--accent-coral);line-height:1;margin-bottom:12px;letter-spacing:0.04em;">
      404
    </div>
    <div style="font-family:var(--font-tech);font-size:0.75rem;color:var(--accent-cyan);letter-spacing:0.16em;text-transform:uppercase;font-weight:700;margin-bottom:16px;">
      [ RESOURCE_NOT_FOUND ]
    </div>
    <h2 style="font-size:1.4rem;margin-bottom:12px;">Endpoint or File Missing</h2>
    <p style="color:var(--text-secondary);font-size:0.9rem;line-height:1.6;margin-bottom:28px;">
      The route, codebase asset, or document you navigated to does not exist or has been relocated to another directory.
    </p>

    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="index.html" class="btn btn-primary">
        ← Return to Homepage
      </a>
      <a href="marketplace.html" class="btn btn-outline">
        Browse Marketplace →
      </a>
    </div>
  </div>
</main>

<div id="page-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/layout.js"></script>
