<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Smart Hub | India's Developer Marketplace</title>
  <meta name="description" content="Sign in to Smart Hub to access your purchased digital assets, instant license keys, developer wallet, and community discussions.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- Header (Injected by layout.js) -->
<div id="page-header"></div>

<!-- Auth Page Container -->
<main class="auth-page">
  <div class="auth-bg-grid"></div>

  <div class="auth-card animate-fadeInUp">
    <!-- Header with Brand Logo -->
    <div class="auth-header">
      <a href="index.html" class="brand-outline-logo" title="Smart Hub — Home">
        <span class="logo-smart">smart</span><span class="logo-dot">.</span><span class="logo-hub">hub</span>
      </a>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to manage your digital products, rupee wallet &amp; downloads</p>
    </div>

    <!-- Navigation Switcher -->
    <div class="auth-tabs-nav" style="display:flex;gap:4px;">
      <button type="button" class="auth-tab-btn active" id="tab-user-login">Sign In</button>
      <a href="register.html" class="auth-tab-btn">Create Account</a>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleFormLogin(event)">
      <div class="auth-form-group">
        <label class="auth-label" for="login-identity">Email or Username</label>
        <div class="auth-input-wrapper">
          <span class="auth-input-icon">✉️</span>
          <input type="text" class="auth-input" id="login-identity" placeholder="Enter your email or username" required autocomplete="username">
        </div>
      </div>

      <div class="auth-form-group">
        <label class="auth-label" for="login-password">Password</label>
        <div class="auth-input-wrapper">
          <span class="auth-input-icon">🔒</span>
          <input type="password" class="auth-input" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" id="pwd-toggle-btn" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <div class="auth-options-row">
        <label class="auth-checkbox-label">
          <input type="checkbox" id="remember-me" checked>
          <span>Remember me for 30 days</span>
        </label>
        <a href="reset-password.html" class="auth-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-outline w-full" id="btn-submit-login">
        Sign In to Smart Hub →
      </button>
    </form>

    <div class="auth-divider">Or continue with</div>

    <!-- Social Authentication Grid -->
    <div class="auth-social-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <button type="button" class="auth-social-btn" onclick="handleSocialAuth('GitHub')" id="btn-github-oauth">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </button>
      <button type="button" class="auth-social-btn" onclick="handleSocialAuth('Google')" id="btn-google-oauth">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Google
      </button>
    </div>

    <div style="text-align:center;margin-top:24px;font-size:0.85rem;color:var(--text-secondary);">
      Don't have an account yet? <a href="register.html" class="auth-link">Create Account for Free →</a>
    </div>
  </div>
</main>

<!-- Footer (Injected by layout.js) -->
<div id="page-footer"></div>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/layout.js"></script>

<script>
// Password Visibility Toggle
const pwdInput = document.getElementById('login-password');
const pwdToggle = document.getElementById('pwd-toggle-btn');
if (pwdToggle && pwdInput) {
  pwdToggle.addEventListener('click', () => {
    const isPass = pwdInput.type === 'password';
    pwdInput.type = isPass ? 'text' : 'password';
    pwdToggle.textContent = isPass ? '🙈' : '👁️';
  });
}

// Form Submit Handler (Strict Backend Verification)
async function handleFormLogin(e) {
  e.preventDefault();
  const identity = document.getElementById('login-identity').value.trim();
  const password = document.getElementById('login-password').value;
  const submitBtn = document.getElementById('btn-submit-login');

  if (!identity || !password) {
    if (window.SH) SH.showToast('Please enter both your identity and password', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Verifying credentials...';

  try {
    const res = await window.SmartHubAPI.login(identity, password);
    if (res && res.success) {
      if (window.SH) SH.showToast(res.message || 'Signed in successfully! 🚀', 'success');
      setTimeout(() => {
        if (res.user && res.user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }
      }, 600);
      return;
    } else {
      if (window.SH) SH.showToast((res && res.error) || 'Invalid email/username or password.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In to Smart Hub →';
    }
  } catch (err) {
    if (window.SH) SH.showToast('Connection error during sign in: ' + err.message, 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In to Smart Hub →';
  }
}

// ── Live OAuth Configuration & Handlers ───────────────────────
let githubClientId = '';
let googleClientId = '';

async function initAuthProviders() {
  try {
    if (window.SmartHubAPI) {
      const config = await window.SmartHubAPI.getAuthConfig();
      if (config) {
        if (config.githubClientId) githubClientId = config.githubClientId;
        if (config.googleClientId) googleClientId = config.googleClientId;
      }
    }
  } catch (e) {}

  setupGoogleClient();

  // Check URL query parameters for OAuth callbacks
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const serverToken = urlParams.get('token');
    const userParam = urlParams.get('user');
    const errorParam = urlParams.get('error');

    if (errorParam && window.SH) {
      SH.showToast(decodeURIComponent(errorParam), 'error');
    }

    if (serverToken) {
      let sessionUser = { isLoggedIn: true, name: 'Developer', role: 'buyer' };
      if (userParam) {
        try {
          sessionUser = JSON.parse(decodeURIComponent(userParam));
        } catch (uErr) {}
      }
      sessionUser.isLoggedIn = true;
      localStorage.setItem('smarthub_user', JSON.stringify(sessionUser));
      if (window.SH) SH.showToast(`Signed in successfully as ${sessionUser.name}! 🚀`, 'success');
      setTimeout(() => {
        window.location.href = sessionUser.role === 'admin' ? 'admin.html' : 'index.html';
      }, 600);
      return;
    }

    // Check if returning from GitHub OAuth redirect with code
    const ghCode = urlParams.get('code');
    if (ghCode) {
      const redirectUri = window.location.origin + window.location.pathname;
      window.history.replaceState({}, document.title, window.location.pathname);
      if (window.SH) SH.showToast('Verifying GitHub authentication with backend...', 'info');
      const res = await window.SmartHubAPI.loginWithGitHub({ code: ghCode, redirectUri });
      if (res && res.success) {
        if (window.SH) SH.showToast(res.message || 'Signed in via GitHub! 🚀', 'success');
        setTimeout(() => {
          window.location.href = (res.user && res.user.role === 'admin') ? 'admin.html' : 'index.html';
        }, 600);
        return;
      } else {
        if (window.SH) SH.showToast((res && res.error) || 'GitHub authentication failed', 'error');
      }
    }

    // Check if returning from Google OAuth redirect with id_token
    if (window.location.hash && window.location.hash.includes('id_token=')) {
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const idToken = hashParams.get('id_token');
      window.history.replaceState({}, document.title, window.location.pathname);
      if (idToken) {
        await verifyGoogleIdToken(idToken);
      }
    }
  } catch (err) {
    console.error('Auth redirect verification error:', err);
  }
}

function setupGoogleClient() {
  if (googleClientId && window.google && window.google.accounts && window.google.accounts.id) {
    try {
      window.google.accounts.id.initialize({
        client_id: googleClientId,
        callback: window.handleGoogleCredential,
        auto_select: false
      });
    } catch (e) {}
  }
}

window.handleGoogleCredential = async function(response) {
  if (!response || !response.credential) return;
  await verifyGoogleIdToken(response.credential);
};

async function verifyGoogleIdToken(idToken) {
  if (window.SH) SH.showToast('Authenticating with Google...', 'info');
  try {
    const res = await window.SmartHubAPI.loginWithGoogle({ idToken });
    if (res && res.success) {
      if (window.SH) SH.showToast(res.message || 'Signed in via Google! 🚀', 'success');
      setTimeout(() => {
        window.location.href = (res.user && res.user.role === 'admin') ? 'admin.html' : 'index.html';
      }, 600);
    } else {
      if (window.SH) SH.showToast((res && res.error) || 'Google authentication failed', 'error');
    }
  } catch (err) {
    if (window.SH) SH.showToast('Google auth error: ' + err.message, 'error');
  }
}

function handleSocialAuth(provider) {
  if (provider === 'GitHub') {
    triggerLiveGitHubOAuth();
  } else if (provider === 'Google') {
    triggerGoogleAuth();
  }
}

function triggerLiveGitHubOAuth() {
  if (!githubClientId) {
    if (window.SH) SH.showToast('GitHub OAuth is not configured yet on this deployment.', 'error');
    return;
  }
  const callbackUrl = window.location.origin + '/login.html';
  const redirectUri = encodeURIComponent(callbackUrl);
  const state = Math.random().toString(36).substring(2);
  sessionStorage.setItem('oauth_state', state);
  if (window.SH) SH.showToast('Redirecting to GitHub authorization... 🐙', 'info');
  setTimeout(() => {
    window.location.href = `https://github.com/login/oauth/authorize?client_id=${encodeURIComponent(githubClientId)}&scope=read:user,user:email&redirect_uri=${redirectUri}&state=${state}`;
  }, 300);
}

function triggerGoogleAuth() {
  if (!googleClientId) {
    if (window.SH) SH.showToast('Google Sign-In is not configured yet on this deployment.', 'error');
    return;
  }
  if (window.SH) SH.showToast('Connecting with Google Sign-In... 🌐', 'info');

  if (window.google && window.google.accounts && window.google.accounts.id) {
    try {
      window.google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
          startGoogleOAuthRedirect();
        }
      });
      return;
    } catch(e) {}
  }
  startGoogleOAuthRedirect();
}

function startGoogleOAuthRedirect() {
  const redirectUri = encodeURIComponent(window.location.origin + '/login.html');
  const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(googleClientId)}&redirect_uri=${redirectUri}&response_type=token%20id_token&scope=openid%20profile%20email&nonce=sh_${Date.now()}`;
  window.location.href = googleAuthUrl;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initAuthProviders);
} else {
  initAuthProviders();
}
</script>
</body>
</html>
